services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ideas-hub-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ideas-hub-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: ideas-hub-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ideas-hub-frontend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  ideas-hub-db-data:
    name: ideas-hub-db-data
